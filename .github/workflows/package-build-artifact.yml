# Package a successful UWP build from an earlier CI run without rebuilding it.

name: Package existing build

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI run ID that contains jadyx-build and spirv-to-dxil artifacts
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: package-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: appx from existing build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Validate source run
        id: source
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('source_run_id must be a positive Actions run ID');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (run.head_repository?.full_name !== repository) {
              core.setFailed(`Source run must belong to ${repository}`);
              return;
            }
            if (run.head_branch !== branch) {
              core.setFailed(`Source run branch ${run.head_branch} does not match ${branch}`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Source run must have completed successfully (got ${run.status}/${run.conclusion})`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            for (const name of ['jadyx-build', 'spirv-to-dxil']) {
              if (!data.artifacts.some(a => a.name === name && !a.expired)) {
                core.setFailed(`Source run is missing an unexpired ${name} artifact`);
                return;
              }
            }

            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(runId));

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: jadyx-build
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build-uwp/bin

      - uses: actions/download-artifact@v8
        with:
          name: spirv-to-dxil
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mesa

      - name: Verify build files and pack/sign APPX
        shell: powershell
        env:
          JADYX_PFX_BASE64: ${{ secrets.JADYX_PFX_BASE64 }}
          JADYX_PFX_PASSWORD: ${{ secrets.JADYX_PFX_PASSWORD }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:JADYX_PFX_BASE64 -or -not $env:JADYX_PFX_PASSWORD) {
              throw "The JADYX_PFX_BASE64 / JADYX_PFX_PASSWORD secrets are not set"
          }
          foreach ($file in @(
              "build-uwp\bin\jadyx.exe",
              "build-uwp\bin\jadyx.pdb",
              "$env:RUNNER_TEMP\mesa\spirv_to_dxil.dll"
          )) {
              if (-not (Test-Path $file -PathType Leaf)) { throw "Required build artifact is missing: $file" }
          }

          $pfx = Join-Path $env:RUNNER_TEMP "jadyx.pfx"
          $base64 = $env:JADYX_PFX_BASE64 -replace '[^A-Za-z0-9+/=]', ''
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          try {
              & tools\xbox\package-appx.ps1 -Release -PfxPath $pfx `
                  -SpirvToDxil (Join-Path $env:RUNNER_TEMP "mesa\spirv_to_dxil.dll")
          } finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          [xml]$mf = Get-Content build-uwp\package\layout\AppxManifest.xml -Raw
          $version = $mf.Package.Identity.Version
          $out = New-Item -ItemType Directory -Force out
          Copy-Item build-uwp\package\jadyx.appx "out\Jadyx_${version}_x64.appx"
          Copy-Item build-uwp\package\jadyx.cer out\
          Copy-Item build-uwp\package\Microsoft.VCLibs.x64.14.00.appx out\
          Compress-Archive build-uwp\bin\jadyx.pdb "out\Jadyx_${version}_symbols.zip"
          [ordered]@{
              version = $version
              source_commit = $env:SOURCE_SHA
              source_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
              package_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json | Set-Content -Encoding ascii out\build-info.json
          Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: jadyx-package
          path: out/*
          if-no-files-found: error
          retention-days: 14
