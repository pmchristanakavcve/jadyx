#
# Every pull request must build. A merge to main does not build again: the PR already built the
# merged result (pull_request checks out the merge commit), and Release builds main itself. A manual
# run also produces a signed test appx as a 14-day artifact.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/xbox/tests/release.py

  build:
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
